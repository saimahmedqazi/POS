name: Release Tauri App

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0, v1.0.1, etc.

jobs:
  release:
    permissions:
      contents: write # Required for tauri-action to create a GitHub Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Install Frontend Dependencies
        # Install from root to respect monorepo
        run: pnpm install

      - name: Inject Environment Variables
        working-directory: ./apps/web
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Generate Self-Signed Code Signing Certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=CYBSOC POS ERP, O=CYBSOC, C=PK" `
            -Type CodeSigning `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(5)
          $pfxPassword = ConvertTo-SecureString -String "CybsocPOS2025" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\cybsoc-pos.pfx" -Password $pfxPassword
          echo "CODESIGN_PFX=$env:RUNNER_TEMP\cybsoc-pos.pfx" >> $env:GITHUB_ENV
          echo "CODESIGN_PASSWORD=CybsocPOS2025" >> $env:GITHUB_ENV
          echo "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Build Tauri App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ env.CODESIGN_THUMBPRINT }}
          # Self-signed cert: eliminates red SmartScreen block screen (shows yellow "unknown publisher" instead)
          # For fully trusted signing, replace with a purchased OV/EV certificate from DigiCert/Sectigo
        with:
          projectPath: "apps/web"
          tagName: ${{ github.ref_name }} # Auto-use the pushed tag
          releaseName: "POS App ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Debug Output Directory
        shell: bash
        run: |
          echo "Listing target/release/bundle directory:"
          find apps/web/src-tauri/target/release/bundle -type f || true

      - name: Manually Generate latest.json
        working-directory: ./apps/web
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SIG=$(cat src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          EXE_NAME=$(basename src-tauri/target/release/bundle/nsis/*-setup.exe)
          
          cat <<EOF > ../latest.json
          {
            "version": "$VERSION",
            "notes": "Automated update",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/saimahmedqazi/POS/releases/download/v$VERSION/$EXE_NAME"
              }
            }
          }
          EOF

      - name: Upload latest.json manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber || true
